[project]
name = "helper-tool"
version = "0.1.0"
description = "A minimal Flask application for text extraction and audio generation."
dependencies = [
    "flask",
    "google-cloud-vision",
    "PyMuPDF",
    "openai",
    "tiktoken",
    "python-dotenv",
    "elevenlabs",
    "websockets>=15.0.1",
    "google-generativeai>=0.8.6",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]
