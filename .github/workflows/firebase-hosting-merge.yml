name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Build the books (Jupyter Book 2 / MyST) via Docker
        run: |
          chmod +x ./scripts/build_books.sh
          ./scripts/build_books.sh
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ISLAMOPEDIA_BOOKS }}'
          channelId: live
          projectId: islamopedia-books
