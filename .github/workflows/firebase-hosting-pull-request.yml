name: Deploy to Firebase Hosting on PR
'on': pull_request
concurrency:
  group: firebase-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v2
      - name: Set execute permissions for build script
        run: chmod +x ./scripts/build_books.sh
      - name: Build the book using docker image
        run: ./scripts/build_books.sh
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy to Firebase preview channel
        id: deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ISLAMOPEDIA_BOOKS }}
        run: |
          set -u
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          CHANNEL="pr-${{ github.event.pull_request.number }}"

          set +e
          OUTPUT=$(firebase hosting:channel:deploy "$CHANNEL" --expires 7d --project islamopedia-books --json)
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"

          # The deploy is genuinely fine if it either succeeded, or only failed because
          # this exact content is already the channel's active release (a redundant no-op).
          if [ "$STATUS" -ne 0 ] \
             && ! printf '%s' "$OUTPUT" | grep -q "is the current active version" \
             && ! printf '%s' "$OUTPUT" | grep -q "already exists"; then
            echo "::error::Firebase preview deploy failed."
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::Channel already serving this exact version (redundant deploy). Content is published; treating as success."
          fi

          # Resolve the preview URL whether the deploy returned success JSON or the no-op error.
          URL=$(printf '%s' "$OUTPUT" | jq -r '.result[]?.url // empty' 2>/dev/null)
          if [ -z "$URL" ]; then
            URL=$(firebase hosting:channel:list --project islamopedia-books --json 2>/dev/null \
              | jq -r --arg c "$CHANNEL" '.result.channels[]? | select(.name | endswith("/channels/" + $c)) | .url' 2>/dev/null | head -n1)
          fi
          echo "Preview URL: ${URL:-<unknown>}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL on PR
        if: ${{ steps.deploy.outputs.url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- firebase-preview-comment -->';
            const body = `${marker}\n### 🔥 Firebase preview\nThis PR is deployed at: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
